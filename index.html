<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PayCheck Mock-up · Team T03</title>
<meta name="description" content="COMP3059 Sprint 4 interactive mock-up of PayCheck: worker app, clinic workspace and admin console.">
<style>*{box-sizing:border-box}
:root{--g9:#0F3D2E;--g7:#1F7A55;--g1:#EEF5F1;--g2:#CDE7D9;--gold:#F2B705;--goldbg:#FFF4D6;--red:#B3372C;--redbg:#FBEDEB;--ink:#17211C;--mut:#4F5E56;--line:#D5E2DA;--bg:#F4F7F5}
html,body{margin:0;background:#E4EBE7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);font-size:14px}
button{font-family:inherit;cursor:pointer;font-size:inherit}
input,select,textarea{font-family:inherit;font-size:15px}
a{color:var(--g7)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
/* top demo bar */
.demobar{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:8px 16px}
.demobar .brand{display:flex;align-items:center;gap:8px;font-weight:700}
.demobar .roles{display:flex;gap:6px;flex-wrap:wrap}
.demobar button{border:1px solid #5E6B64;background:transparent;color:#fff;border-radius:8px;padding:6px 12px;font-weight:600}
.demobar button.on{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.chk{width:26px;height:26px;border-radius:7px;background:var(--gold);color:var(--g9);display:inline-flex;align-items:center;justify-content:center;font-weight:800}
/* landing */
.landing{max-width:1040px;margin:0 auto;padding:32px 20px 60px}
.landing h1{font-size:34px;margin:8px 0;color:var(--g9)}
.lead{font-size:16px;color:var(--mut);max-width:760px;line-height:1.5}
.cards3{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin:24px 0}
.rolecard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:10px;text-align:left}
.rolecard h3{margin:0;font-size:19px}
.rolecard ul{margin:0;padding-left:18px;color:var(--mut);line-height:1.55}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:13px}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap}
.t-high{background:var(--g9);color:#fff}.t-med{background:var(--gold);color:var(--ink)}.t-fut{background:#E1E6E3;color:#4F5E56}
.t-ok{background:#E3F1E9;color:#155C3F}.t-bad{background:var(--redbg);color:#8E2A20}.t-warn{background:var(--goldbg);color:#6B4E00}
/* phone */
.stage{display:flex;justify-content:center;padding:24px 12px 40px}
.phone{width:390px;height:844px;background:var(--bg);border-radius:36px;border:10px solid #17211C;overflow:hidden;display:flex;flex-direction:column;position:relative;box-shadow:0 20px 50px rgba(15,61,46,.25)}
@media(max-width:430px){.stage{padding:0}.phone{width:100vw;height:calc(100vh - 52px);border:0;border-radius:0}}
.appbar{background:var(--g9);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.appbar .title{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px}
.jobsel{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:8px;padding:5px 8px;font-size:12px;font-weight:600}
.iconbtn{position:relative;width:36px;height:36px;border-radius:10px;border:0;background:rgba(255,255,255,.12);color:#fff;display:flex;align-items:center;justify-content:center}
.dot{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:4px;background:var(--gold)}
.scroll{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-top:1px solid var(--line)}
.tabs button{border:0;background:#fff;padding:8px 0 10px;font-size:11px;font-weight:600;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:3px}
.tabs button.on{color:var(--g9)}
.tabs svg{width:22px;height:22px}
.tabs button.on svg{stroke:var(--g7)}
h1.s{font-size:22px;margin:0}
h2.s{font-size:16px;margin:4px 0 0}
.sub{color:var(--mut);font-size:13px;line-height:1.45}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.list{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid #E6EEE9;width:100%;background:#fff;border-left:0;border-right:0;border-top:0;text-align:left;color:var(--ink)}
.li:last-child{border-bottom:0}
.btn{border:0;border-radius:12px;height:46px;padding:0 16px;font-weight:700;background:var(--g9);color:#fff;width:100%}
.btn.sm{height:36px;width:auto;border-radius:10px;font-size:13px}
.btn.gold{background:var(--gold);color:var(--g9)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.outline{background:#fff;color:var(--g9);border:1.5px solid var(--g9)}
.btn.danger{background:var(--redbg);color:#8E2A20}
.btn.dis{background:#D5E2DA;color:var(--mut);cursor:not-allowed}
.btn.done{background:#E3F1E9;color:#155C3F;border:1px solid #8DBFA6}
.link{border:0;background:transparent;color:var(--g7);font-weight:600;padding:0;text-align:left}
.alert{border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;line-height:1.45}
.alert.red{background:var(--redbg);border:1px solid #E7B9B3;color:#6E1F17}
.alert.gold{background:var(--goldbg);border:1px solid #E5C866;color:#5C4400}
.alert.green{background:#E3F1E9;border:1px solid #8DBFA6;color:#155C3F}
.alert.grey{background:#F0F2F1;border:1px solid #D9DFDC;color:#4F5E56}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}
.stat .k{font-size:12px;color:var(--mut)}.stat .v{font-size:22px;font-weight:800;color:var(--g9);margin-top:2px}.stat .v.red{color:var(--red)}
.bars{display:flex;align-items:flex-end;gap:10px;height:120px;position:relative;padding-top:6px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--mut)}
.bar div{width:100%;border-radius:6px 6px 2px 2px;background:var(--g7)}
.bar div.ot{background:var(--red)}
.line44{position:absolute;left:0;right:0;border-top:2px dashed #0F3D2E;z-index:1}
.seg{display:grid;grid-template-columns:1fr 1fr;background:#E4EBE7;border-radius:10px;padding:3px}
.seg button{border:0;border-radius:8px;padding:8px;font-weight:700;background:transparent;color:var(--mut)}
.seg button.on{background:#fff;color:var(--g9);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.field{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--mut)}
.field{min-width:0}.field input,.field select,.field textarea{width:100%;min-width:0;height:44px;border:1px solid var(--line);border-radius:10px;padding:0 12px;color:var(--ink);background:#fff}
.field textarea{height:70px;padding:10px 12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-size:12.5px;font-weight:600;color:var(--ink)}
.chip.on{background:var(--g9);color:#fff;border-color:var(--g9)}
.math{background:#F7F9F8;border:1px dashed #B7C9BE;border-radius:10px;padding:10px 12px;font-size:12.5px;line-height:1.6}
.steps{display:flex;flex-direction:column;gap:0}
.step{display:flex;gap:10px;align-items:flex-start;padding:8px 0}
.step .n{width:26px;height:26px;border-radius:13px;flex:none;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;border:2px solid var(--line);color:var(--mut);background:#fff}
.step.done .n{background:var(--g7);border-color:var(--g7);color:#fff}
.step.cur .n{border-color:var(--gold);color:var(--g9);background:var(--goldbg)}
.bubble{max-width:82%;padding:10px 12px;border-radius:14px;line-height:1.45;font-size:13.5px}
.bubble.me{align-self:flex-end;background:var(--g9);color:#fff;border-bottom-right-radius:4px}
.bubble.them{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px}
.toggle{width:44px;height:26px;border-radius:13px;background:#C9D3CE;position:relative;flex:none;border:0}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:10px;background:#fff;transition:left .15s}
.toggle.on{background:var(--g7)}.toggle.on::after{left:21px}
.sheet{position:absolute;inset:0;background:rgba(23,33,28,.45);display:flex;align-items:flex-end;z-index:5}
.sheet>div{background:#fff;width:100%;border-radius:20px 20px 0 0;padding:18px;display:flex;flex-direction:column;gap:10px;max-height:85%;overflow:auto}
.toast{position:absolute;left:16px;right:16px;bottom:78px;background:var(--ink);color:#fff;border-radius:12px;padding:12px 14px;font-size:13px;z-index:6}
.dtoast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:var(--ink);color:#fff;border-radius:12px;padding:12px 16px;z-index:30}
/* desktop (clinic/admin) */
.desk{max-width:1280px;margin:0 auto;min-height:calc(100vh - 52px);background:var(--bg)}
.dhead{background:var(--g9);color:#fff;padding:14px 24px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.dhead.admin{background:#17211C}
.dnav{display:flex;gap:8px;flex-wrap:wrap;padding:16px 24px 0}
.dnav button{height:40px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:#fff;font-weight:600;color:var(--ink)}
.dnav button.on{background:var(--g9);color:#fff;border-color:var(--g9)}
.dbody{padding:18px 24px 40px;display:flex;flex-direction:column;gap:16px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:16px;align-items:start}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}
table.t{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
table.t th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:#5E6B64;background:#F7F9F8;padding:10px 12px;border-bottom:1px solid var(--line)}
table.t td{padding:11px 12px;border-bottom:1px solid #E6EEE9;vertical-align:top}
table.t tr.sel td{background:#EEF5F1}
table.t tr.click{cursor:pointer}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.hbar{display:grid;grid-template-columns:150px 1fr 60px;gap:10px;align-items:center;margin:8px 0}
.hbar .track{height:14px;background:var(--g1);border-radius:7px;overflow:hidden}.hbar .fill{height:100%;background:var(--g7);border-radius:7px}
.login{min-height:calc(100vh - 52px);display:flex;align-items:center;justify-content:center;padding:24px}
.login .box{width:100%;max-width:420px;background:#fff;border-radius:18px;padding:28px;display:flex;flex-direction:column;gap:14px;box-shadow:0 10px 40px rgba(0,0,0,.15)}
.codein{height:54px!important;font-size:24px!important;letter-spacing:8px;text-align:center;font-family:ui-monospace,Menlo,monospace}
.future{border:1.5px dashed #AEB9B3;background:#FAFBFA}
.empty{color:var(--mut);text-align:center;padding:30px}
@media print{.demobar{display:none}}
.rolecard .btn{display:flex;align-items:center;justify-content:center;margin-top:auto}
</style></head>
<body><div id="app"></div>
<script>
/* PayCheck interactive mock-up – Team T03 – COMP3059 Sprint 4
   Standalone: no internet, no build step. All data is invented test data. */
const $root = document.getElementById('app');
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const money = (n) => '$' + Number(n).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
const RATE = 17.95, OTP = 8.975;

const INIT = {
  role: 'home', toast: '',
  // worker
  w: { screen: 'signin', tab: 'home', job: 'hg', consent: false, onShift: false, shiftStart: '', weekHours: 18,
    seg: 'log', scan: 'idle', scanPick: null, scanSaved: false, openShift: null, edits: {}, edit: null,
    su: { step: 1, name: 'Maria Santos', email: 'maria.s@example.com', employer: 'Harbour Grill', address: '120 Queens Quay W, Toronto', start: '2025-03-03', rate: '17.95', sched: '2w', face: false, home: false, remind: false },
    stub: 'none', stubHours: null, stubWarn: false, newStub: false, openPeriod: null, mathOpen: null,
    guide: null, screen1: {}, ev: 'all', notes: [], noteDraft: '',
    claim: 0, shared: false, shareClinic: 'Parkdale Community Legal Services', shareDays: 30, sheet: null, downloaded: false,
    msgs: [{ me: false, t: 'Hi Maria, I’m Aisha from the clinic. I’ve started reviewing your Harbour Grill case.' }, { me: false, t: 'Could you upload your Sep 17 pay stub (Aug 31 – Sep 13)? I need it to confirm the Labour Day amount.', req: true }],
    reqDone: false, msgDraft: '', unread: true,
    tips: [{ d: 'Oct 10', a: 64.0 }, { d: 'Oct 9', a: 41.5 }], tipDraft: '',
    notif: { shift: true, pay: true, deadline: true }, othersOut: false, exported: false, delAsk: false },
  // clinic
  c: { auth: 'login', code: '', tab: 'intake', assigned: {}, sel: 'maria', ev: null, notes: { maria: ['Overtime is clear from the stubs. Labour Day: confirm she did not work it (her note from Sep 8 says so).'] }, noteDraft: '',
    status: {}, reqSent: {}, msgs: [{ me: false, t: 'Thanks, I’ll upload it tonight.' }], msgDraft: '' },
  // admin
  a: { auth: 'login', code: '', tab: 'rules', editing: null, draft: '', eff: '2027-10-01', invite: '', invited: [], off: {},
    audit: [['Minimum wage version added: $17.95 effective Oct 1, 2026 (previous $17.60 kept for earlier pay periods)', 'Sep 15, 2026'], ['Caseworker invited: omar.h@parkdalelegal.example (Parkdale Community Legal Services)', 'Sep 2, 2026'], ['Public holiday list for 2027 added (9 holidays)', 'Aug 20, 2026']],
    rules: [
      { id: 'mw', name: 'General minimum wage', sec: 's. 23.1', versions: [['$17.20 / h', 'Oct 1, 2024'], ['$17.60 / h', 'Oct 1, 2025'], ['$17.95 / h', 'Oct 1, 2026']] },
      { id: 'ot', name: 'Overtime threshold', sec: 's. 22', versions: [['44 h per work week', 'Sep 4, 2001']] },
      { id: 'om', name: 'Overtime multiplier', sec: 's. 22', versions: [['1.5 × regular rate', 'Sep 4, 2001']] },
      { id: 'v4', name: 'Vacation pay (under 5 years)', sec: 's. 35.2', versions: [['4%', 'Sep 4, 2001']] },
      { id: 'v6', name: 'Vacation pay (5+ years)', sec: 's. 35.2', versions: [['6%', 'Jan 1, 2018']] },
      { id: 'ph', name: 'Public holiday pay divisor', sec: 's. 24', versions: [['÷ 20 (4 work weeks)', 'Jan 1, 2018']] },
      { id: 'cl', name: 'Claim window', sec: 's. 111', versions: [['2 years', 'Feb 20, 2015']] }] }
};
let S = JSON.parse(JSON.stringify(INIT));
try { const h = decodeURIComponent(location.hash.slice(1)); if (h.startsWith('{')) deepAssign(S, JSON.parse(h)); } catch (e) {}
function deepAssign(t, s) { for (const k in s) { if (s[k] && typeof s[k] === 'object' && !Array.isArray(s[k]) && t[k] && typeof t[k] === 'object') deepAssign(t[k], s[k]); else t[k] = s[k]; } return t; }
function up(path, val) { const ks = path.split('.'); let o = S; ks.slice(0, -1).forEach((k) => (o = o[k])); o[ks[ks.length - 1]] = val; }
function get(path) { return path.split('.').reduce((o, k) => (o == null ? o : o[k]), S); }
function toast(t) { S.toast = t; render(); clearTimeout(toast.h); toast.h = setTimeout(() => { S.toast = ''; render(); }, 2400); }

/* ---------- data ---------- */
function periods() {
  const P = [
    { id: 'p1', label: 'Aug 31 – Sep 13', pay: 'Sep 17', hours: 100, weeks: [['Aug 31', 52], ['Sep 7', 48]], hol: 157.96 },
    { id: 'p2', label: 'Sep 14 – Sep 27', pay: 'Oct 1', hours: 100, weeks: [['Sep 14', 50], ['Sep 21', 50]], hol: 0 }];
  if (S.w.newStub) P.push({ id: 'p3', label: 'Sep 28 – Oct 11', pay: 'Oct 15', hours: 98, weeks: [['Sep 28', 50], ['Oct 5', 48]], hol: 0, isNew: true });
  P.forEach((p) => { p.ot = p.weeks.reduce((a, [, h]) => a + Math.max(0, h - 44), 0); p.otAmt = +(p.ot * OTP).toFixed(2); p.gross = +(p.hours * RATE).toFixed(2); p.short = +(p.otAmt + p.hol).toFixed(2); });
  return P;
}
const VAC = 179.5;
function owed() { return +(periods().reduce((a, p) => a + p.short, 0) + VAC).toFixed(2); }

/* ---------- icons ---------- */
const I = {
  home: '<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  pay: '<rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M7 15h4"/>',
  book: '<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5"/>',
  more: '<circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/>',
  msg: '<path d="M4 5h16v11H8l-4 4z"/>'
};
const svg = (k, c = 'currentColor') => `<svg viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${I[k]}</svg>`;

/* ---------- shared bits ---------- */
const btn = (label, act, cls = '', arg = '') => `<button class="btn ${cls}" data-a="${act}" data-arg="${esc(arg)}">${label}</button>`;
const back = (label, act, arg) => `<button class="link" data-a="${act}" data-arg="${arg || ''}">‹ ${label}</button>`;
const tag = (t, c) => `<span class="tag ${c}">${t}</span>`;
const field = (label, bind, type = 'text', extra = '') => `<label class="field">${label}<input type="${type}" data-b="${bind}" value="${esc(get(bind))}" ${extra}></label>`;
const disclaimer = '<div class="sub" style="font-size:11.5px">Worker-prepared estimate based on the information you entered. Not legal advice or a Ministry decision.</div>';

/* =================== WORKER =================== */
function worker() {
  const w = S.w;
  if (w.screen === 'signin') return phone(signin(), false);
  if (w.screen === 'signup') return phone(signup(), false);
  const map = { home: wHome, shifts: wShifts, pay: wPay, guide: wGuide, more: wMore, edit: wEdit, stub: wStub, claim: wClaim, package: wPackage, evidence: wEvidence, messages: wMessages, jobs: wJobs, profile: wProfile, screening: wScreening };
  return phone((map[w.screen] || wHome)(), true);
}
function phone(inner, chrome) {
  const w = S.w;
  const tabs = [['home', 'Home', 'home'], ['shifts', 'Shifts', 'clock'], ['pay', 'Pay', 'pay'], ['guide', 'Rights', 'book'], ['more', 'More', 'more']];
  return `<div class="stage"><div class="phone">
  ${chrome ? `<div class="appbar"><div class="title"><span class="chk">✓</span>PayCheck</div>
    <select class="jobsel" data-b="w.job" data-render="1"><option value="hg" ${w.job === 'hg' ? 'selected' : ''}>Harbour Grill · Server</option><option value="dg" ${w.job === 'dg' ? 'selected' : ''}>Daily Grind · Barista</option></select>
    <button class="iconbtn" data-a="go" data-arg="messages" aria-label="Messages">${svg('msg', '#fff')}${w.unread ? '<span class="dot"></span>' : ''}</button></div>` : ''}
  <div class="scroll" id="scroll">${inner}</div>
  ${chrome ? `<nav class="tabs">${tabs.map(([id, l, ic]) => `<button class="${w.tab === id ? 'on' : ''}" data-a="tab" data-arg="${id}">${svg(ic)}${l}</button>`).join('')}</nav>` : ''}
  ${w.sheet ? sheet() : ''}${S.toast ? `<div class="toast">${esc(S.toast)}</div>` : ''}
  </div></div>`;
}
function signin() {
  const w = S.w;
  return `<div style="flex:1;display:flex;flex-direction:column;gap:14px;padding-top:40px">
  <div style="display:flex;align-items:center;gap:10px;font-size:26px;font-weight:800;color:var(--g9)"><span class="chk" style="width:40px;height:40px;font-size:22px">✓</span>PayCheck</div>
  <div style="font-size:22px;font-weight:700;line-height:1.3">Know if you were paid right. Prove it if you weren’t.</div>
  <div class="sub">For hourly workers in Ontario. Your employer never sees your PayCheck records.</div>
  ${field('Email', 'w.su.email', 'email')}
  <label class="field">Password<input type="password" value="demo-password"></label>
  <label style="display:flex;gap:10px;font-size:13px;line-height:1.45"><input type="checkbox" data-c="w.consent" ${w.consent ? 'checked' : ''} style="width:20px;height:20px;margin:0;flex:none"> I agree to the privacy notice. My records are private and I can delete them anytime.</label>
  ${btn(w.consent ? 'Sign in' : 'Accept the privacy notice to sign in', 'signin', w.consent ? '' : 'dis')}
  <button class="btn ghost" data-a="toast" data-arg="Face ID would sign you in here (passkey).">Sign in with Face ID</button>
  ${btn('New here? Create an account', 'signupStart', 'outline')}
  <div class="sub" style="text-align:center;margin-top:auto">Demo: any password works. Data is invented test data.</div></div>`;
}
function signup() {

function render() {
  const sc = document.getElementById('scroll'), top = sc ? sc.scrollTop : 0;
  const roles = [['home', 'Start'], ['worker', 'Worker'], ['clinic', 'Clinic'], ['admin', 'Admin']];
  const bar = `<div class="demobar"><div class="brand"><span class="chk">✓</span>PayCheck mock-up · T03</div><div class="roles">${roles.map(([k, l]) => `<button class="${S.role === k ? 'on' : ''}" data-a="role" data-arg="${k}">${l}</button>`).join('')}<button data-a="reset">Restart demo</button></div></div>`;
  const view = { home: landing, worker, clinic, admin }[S.role]();
  $root.innerHTML = bar + view;
  const sc2 = document.getElementById('scroll'); if (sc2 && render.keep) sc2.scrollTop = top; render.keep = false;
}
const A = {
  role: (r) => { S.role = r; window.scrollTo(0, 0); },
  reset: () => { S = JSON.parse(JSON.stringify(INIT)); },
  toast: (t) => toast(t),
  set: (arg) => { const i = arg.indexOf('='); let v = arg.slice(i + 1); up(arg.slice(0, i), v === '1' ? true : v === '' ? null : v); render.keep = true; },
  go: (s) => { const w = S.w; w.screen = s; if (['home', 'shifts', 'pay', 'guide', 'more'].includes(s)) w.tab = s; if (s === 'messages') w.unread = false; },
  tab: (t) => { S.w.tab = t; S.w.screen = t; if (t === 'guide') S.w.guide = null; },
  signin: () => { if (S.w.consent) S.w.screen = 'home', S.w.tab = 'home'; },
  signout: () => { S.w.screen = 'signin'; },
  signupStart: () => { S.w.screen = 'signup'; S.w.su.step = 1; S.w.consent = false; },
  suBack: () => { if (S.w.su.step === 1) S.w.screen = 'signin'; else S.w.su.step--; },
  suNext: () => { const su = S.w.su; if (su.step === 1 && !(S.w.consent && su.name.trim() && /.+@.+\..+/.test(su.email))) return; su.step++; },
  suDone: () => { S.w.screen = 'home'; S.w.tab = 'home'; toast('Welcome, ' + S.w.su.name.split(' ')[0] + '! Your job is set up.'); },
  shiftToggle: () => { const w = S.w; if (!w.onShift) { w.onShift = true; w.shiftStart = '10:58'; toast('Shift started at 10:58 – server time, not your phone’s.'); } else { w.onShift = false; w.weekHours += 10; toast('Shift ended: 10 h logged · ' + w.weekHours + ' h this week.'); } },
  openShift: (id) => { S.w.openShift = S.w.openShift === id ? null : id; render.keep = true; },
  editStart: () => { const r = shiftRows().find((x) => x.id === S.w.openShift); S.w.edit = { id: r.id, st: r.st, en: r.en, reason: null, proof: false }; S.w.screen = 'edit'; },
  editSave: () => { const e = S.w.edit; if (!e.reason || toMin(e.en) <= toMin(e.st)) return; S.w.edits[e.id] = { ...e }; S.w.screen = 'shifts'; S.w.tab = 'shifts'; S.w.seg = 'log'; toast('Saved. The original time is kept in the history.'); },
  scanSave: () => { if (!S.w.scanPick) return; S.w.scan = 'done'; },
  stubStart: () => { S.w.stub = 'photo'; S.w.stubHours = null; S.w.stubWarn = false; S.w.screen = 'stub'; },
  stubRead: () => { if (S.w.stub === 'reading') return; S.w.stub = 'reading'; setTimeout(() => { S.w.stub = 'review'; render(); }, 1200); },
  stubH: (h) => { if (h === '93') S.w.stubWarn = true; else { S.w.stubHours = 98; S.w.stubWarn = false; } },
  stubCheck: () => { if (!S.w.stubHours) return; S.w.newStub = true; S.w.stub = 'none'; S.w.screen = 'pay'; S.w.tab = 'pay'; S.w.openPeriod = 'p3'; toast('Checked against 4 ESA rules: short $89.75 (overtime).'); },
  openPeriod: (p) => { S.w.openPeriod = S.w.openPeriod === p ? null : p; if (S.w.screen !== 'pay') { S.w.screen = 'pay'; S.w.tab = 'pay'; S.w.openPeriod = p; } else render.keep = true; },
  math: (k) => { S.w.mathOpen = S.w.mathOpen === k ? null : k; render.keep = true; },
  claimCreate: () => { S.w.claim = 1; S.w.screen = 'package'; },
  claimNext: () => { const w = S.w; if (w.claim === 1 && !w.shared) w.claim = 3; else w.claim = Math.min(4, w.claim + 1); render.keep = true; },
  sheet: (s) => { S.w.sheet = s; },
  share: () => { S.w.shared = true; S.w.sheet = null; if (S.w.claim < 2) S.w.claim = 1; toast('Shared read-only with ' + S.w.shareClinic + '.'); },
  unshare: () => { S.w.shared = false; toast('Sharing stopped. The clinic lost access immediately.'); },
  deleteAcct: () => { S.w.sheet = null; S.w.screen = 'signin'; S.w.consent = false; toast('Account deletion requested. Everything is removed within 24 hours.'); },
  addNote: () => { const v = S.w.noteDraft.trim(); if (v) { S.w.notes.unshift(v); S.w.noteDraft = ''; } },
  reqDone: () => { S.w.reqDone = true; S.w.msgs.push({ me: true, t: 'Done – I uploaded the Sep 17 stub.' }); },
  sendMsg: () => { const v = S.w.msgDraft.trim(); if (v) { S.w.msgs.push({ me: true, t: v }); S.w.msgDraft = ''; } },
  addTip: () => { const v = parseFloat(S.w.tipDraft); if (v > 0) { S.w.tips.unshift({ d: 'Today', a: v }); S.w.tipDraft = ''; } },
  notif: (k) => { S.w.notif[k] = !S.w.notif[k]; render.keep = true; },
  assign: (arg) => { const [id, who] = arg.split('|'); S.c.assigned[id] = who; toast('Assigned to ' + who + '.'); },
  openCase: (id) => { S.c.sel = id; S.c.tab = 'cases'; S.c.ev = null; },
  selCase: (id) => { S.c.sel = id; S.c.ev = null; },
  cNote: () => { const v = S.c.noteDraft.trim(), id = S.c.sel; if (v) { (S.c.notes[id] = S.c.notes[id] || []).push(v); S.c.noteDraft = ''; } },
  cStatus: (s) => { S.c.status[S.c.sel] = s; toast('Status: ' + s + ' (written to the audit log).'); },
  cSend: () => { const v = S.c.msgDraft.trim(); if (v) { S.c.msgs.push({ me: true, t: v }); S.c.msgDraft = ''; } },
  ruleEdit: (id) => { const r = S.a.rules.find((x) => x.id === id); S.a.editing = id; S.a.draft = r.versions[r.versions.length - 1][0]; S.a.eff = '2027-10-01'; },
  ruleSave: () => { const a = S.a, r = a.rules.find((x) => x.id === a.editing), d = new Date(a.eff + 'T00:00:00'); const ds = isNaN(d) ? a.eff : d.toLocaleDateString('en-CA', { month: 'short', day: 'numeric', year: 'numeric' }); const old = r.versions[r.versions.length - 1][0]; r.versions.push([a.draft, ds]); a.audit.unshift([`${r.name}: new version ${a.draft} effective ${ds} (previous ${old} kept for earlier pay periods)`, 'Today']); a.editing = null; toast('New rule version saved and logged.'); },
  invite: () => { const v = S.a.invite.trim(); if (/.+@.+\..+/.test(v)) { S.a.invited.push(v); S.a.audit.unshift(['Caseworker invited: ' + v, 'Today']); S.a.invite = ''; toast('Invite sent. The link expires in 7 days.'); } else toast('Enter a valid email address.'); },
  toggleOff: (n) => { const off = !S.a.off[n]; S.a.off[n] = off; S.a.audit.unshift([(off ? 'Deactivated ' : 'Reactivated ') + n + (off ? ' – sessions ended, open cases returned to intake' : ''), 'Today']); }
};
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  if (el.classList.contains('dis')) return;
  const f = A[el.dataset.a]; if (!f) return;
  e.preventDefault(); f(el.dataset.arg || ''); if (el.dataset.a !== 'toast') render();
});
document.addEventListener('input', (e) => { const b = e.target.dataset.b; if (!b) return; let v = e.target.value; if (b.endsWith('.code')) v = v.replace(/\D/g, '').slice(0, 6); up(b, v); });
document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.dataset.c) { up(t.dataset.c, t.checked); render.keep = true; render(); return; }
  if (t.dataset.b && (t.dataset.render || t.tagName === 'SELECT')) { up(t.dataset.b, t.value); render.keep = true; render(); }
});
document.addEventListener('keyup', (e) => { const t = e.target; if (t.dataset && t.dataset.b && t.dataset.b.endsWith('.code')) { const pos = t.value.length; render(); const n = document.querySelector('[data-b="' + t.dataset.b + '"]'); if (n) { n.focus(); n.setSelectionRange(pos, pos); } } });
render();
